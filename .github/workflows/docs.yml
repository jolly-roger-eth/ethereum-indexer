# Builds the VitePress site (plus the web demo it embeds) and deploys it to GitHub Pages
#
name: Deploy VitePress site to Pages

on:
  # Runs on pushes targeting the `main` branch. Change this to `master` if you're
  # using the `master` branch as the default branch.
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled

      # No `version:` here ON PURPOSE: it comes from `packageManager` in the root
      # package.json. Specifying both is an ERROR in pnpm/action-setup ("Multiple
      # versions of pnpm specified"), not a precedence rule. It resolves to pnpm
      # 10, which is what this repo needs: the lockfile is v9, and pnpm 11 fails
      # the install until every ignored build script is resolved in
      # pnpm-workspace.yaml.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm build

      # The docs used to embed a demo at /examples, copied from
      # `examples/web-demo/dist`. That package was DELETED (39 files, commit
      # bb86a77, retiring the JS-object processor path) and the two steps that
      # built and copied it were not removed with it, so every run since failed at
      # `cp: cannot stat 'examples/web-demo/dist'`. Because `Deploy` depends on
      # `build`, it was SKIPPED rather than failed, and the site silently stopped
      # updating instead of breaking loudly.
      #
      # Nothing referenced the copied demo: the only /examples link in the docs
      # points at the OLD project's Pages site. Re-adding a demo is a deliberate
      # choice about what the site should offer, not something to reconstruct here.
      - name: Build with VitePress
        run: pnpm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
